# 镜像 tag：与根目录 VERSION 对齐的 semver 由 CI 推送；自动流水线不更新 :latest（见 docs/CI_RELEASE.md）。
# 若需 latest，请自行在 Docker Hub 打标签或改此处 image。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spf-server
  namespace: spf
  labels:
    app: spf-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spf-server
  template:
    metadata:
      labels:
        app: spf-server
    spec:
      containers:
        - name: spf-server
          image: dockersenseyang/ssh_port_forwarder:1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: DATABASE_TYPE
              value: "mysql"
            - name: SPF_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: spf-secrets
                  key: db-dsn
            - name: JWT_SECRET_CURRENT
              valueFrom:
                secretKeyRef:
                  name: spf-secrets
                  key: jwt-secret
            - name: SPF_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: spf-secrets
                  key: encryption-key
            - name: SPF_PORT_RANGE_MIN
              value: "30000"
            - name: SPF_PORT_RANGE_MAX
              value: "33000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
