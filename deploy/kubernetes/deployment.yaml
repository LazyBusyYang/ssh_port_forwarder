apiVersion: apps/v1
kind: Deployment
metadata:
  name: spf-server
  labels:
    app: spf-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spf-server
  template:
    metadata:
      labels:
        app: spf-server
    spec:
      containers:
        - name: spf-server
          image: dockersenseyang/ssh_port_forwarder:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_TYPE
              value: "mysql"
            - name: SPF_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: spf-secrets
                  key: db-dsn
            - name: JWT_SECRET_CURRENT
              valueFrom:
                secretKeyRef:
                  name: spf-secrets
                  key: jwt-secret
            - name: SPF_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: spf-secrets
                  key: encryption-key
            - name: SPF_PORT_RANGE_MIN
              value: "30000"
            - name: SPF_PORT_RANGE_MAX
              value: "33000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
