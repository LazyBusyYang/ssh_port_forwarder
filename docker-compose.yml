# 本地/演示：MySQL + 官方镜像（单进程内嵌前端与 API）。生产请改密钥、收紧端口暴露并配合反向代理 TLS。
# 镜像 tag：CI 仅自动推送与根目录 VERSION 一致的 semver，不更新 :latest（见 docs/CI_RELEASE.md）。
# 请在 .env 中设置 SPF_IMAGE_TAG（建议与 VERSION 一致）；未设置时默认 latest 仅为本地快捷写法。
name: ssh-port-forwarder

services:
  mysql:
    image: mysql:8.0
    container_name: spf-mysql
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-spf}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  spf:
    image: dockersenseyang/ssh_port_forwarder:${SPF_IMAGE_TAG:-latest}
    container_name: spf-server
    env_file: .env
    environment:
      DATABASE_TYPE: mysql
      SPF_DB_DSN: ${SPF_DB_DSN:?set SPF_DB_DSN in .env}
      JWT_SECRET_CURRENT: ${JWT_SECRET_CURRENT:?set JWT_SECRET_CURRENT in .env}
      SPF_ENCRYPTION_KEY: ${SPF_ENCRYPTION_KEY:?set SPF_ENCRYPTION_KEY in .env}
      SPF_PORT_RANGE_MIN: ${SPF_PORT_RANGE_MIN:-30000}
      SPF_PORT_RANGE_MAX: ${SPF_PORT_RANGE_MAX:-33000}
    ports:
      - "8080:8080"
      - "30000-33000:30000-33000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
