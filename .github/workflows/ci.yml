name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: dockersenseyang/ssh_port_forwarder

jobs:
  check-version:
    name: Check VERSION
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate VERSION / tag alignment
        run: bash scripts/check_version.sh

  release-gate:
    name: Release gate (semver publish?)
    needs: [check-version]
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide Docker Hub publish
        id: gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: bash scripts/ci_release_gate.sh

  frontend-lint:
    name: Frontend Lint & Format
    needs: [check-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Run ESLint
        run: cd web && npm run lint:ci

      - name: Check Prettier formatting
        run: cd web && npm run format:check

  web-embed:
    name: Build web (for go:embed)
    needs: [check-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Build frontend
        run: cd web && npm run build

      - name: Upload web/dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  backend-lint:
    name: Backend Lint
    needs: [web-embed]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download web/dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  backend-unit-test:
    name: Backend Unit Tests
    needs: [web-embed]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download web/dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run unit tests
        run: go test ./internal/... -v -count=1
        env:
          CGO_ENABLED: 1

  sqlite-integration-test:
    name: SQLite Integration Tests
    needs: [web-embed]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download web/dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run SQLite integration tests
        run: make test-sqlite-integration

  mysql-integration-test:
    name: MySQL Integration Tests
    needs: [web-embed]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: spf_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download web/dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h127.0.0.1 -P3306 -uroot -ptestroot --silent; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Run MySQL integration tests
        run: make test-mysql-integration

  docker-publish:
    name: Publish semver image (Docker Hub)
    runs-on: ubuntu-latest
    needs:
      - check-version
      - release-gate
      - frontend-lint
      - web-embed
      - backend-lint
      - backend-unit-test
      - sqlite-integration-test
      - mysql-integration-test
    if: >
      github.event_name == 'push' &&
      needs.release-gate.outputs.publish == 'true' &&
      needs.check-version.result == 'success' &&
      needs.frontend-lint.result == 'success' &&
      needs.web-embed.result == 'success' &&
      needs.backend-lint.result == 'success' &&
      needs.backend-unit-test.result == 'success' &&
      needs.sqlite-integration-test.result == 'success' &&
      needs.mysql-integration-test.result == 'success'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract VERSION and skip if image exists
        id: meta
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          if docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" >/dev/null 2>&1; then
            echo "Image ${IMAGE_NAME}:${VERSION} already exists; skipping build."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and push
        if: steps.meta.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          provenance: false
