name: Docker manual (dev / sha-*)

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref to build (branch, tag, or SHA). Leave empty to use the commit of the branch selected in "Use workflow from".'
        required: false
        default: ''
      image_tag:
        description: 'Docker Hub image tag: dev or sha-* (e.g. sha-abc1234)'
        required: true
        default: 'dev'

env:
  IMAGE_NAME: dockersenseyang/ssh_port_forwarder

jobs:
  push:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref != '' && inputs.git_ref || github.sha }}

      - name: Show resolved revision
        run: |
          set -euo pipefail
          echo "Resolved HEAD: $(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Validate image tag
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ "${TAG}" == "dev" ]]; then
            exit 0
          fi
          if [[ "${TAG}" =~ ^sha-[A-Za-z0-9._-]+$ ]]; then
            exit 0
          fi
          echo "image_tag must be exactly \"dev\" or match ^sha-[A-Za-z0-9._-]+$ (got: ${TAG})" >&2
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          provenance: false
