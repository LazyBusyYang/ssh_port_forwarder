# 本地开发：仅启动 MySQL，供 SPF 连接验收（与主应用镜像独立）
services:
  mysql:
    image: mysql:8.0
    container_name: spf-dev-mysql
    environment:
      MYSQL_ROOT_PASSWORD: spfdevroot
      MYSQL_DATABASE: spf
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pspfdevroot"]
      interval: 5s
      timeout: 5s
      retries: 15
